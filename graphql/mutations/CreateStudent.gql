mutation CreateStudent($createStudentInput: CreateStudentInput!, $idGroup: Int!) {
  createStudent(createStudentInput: $createStudentInput, id_group: $idGroup) {
    id_student
    name
    last_name
    type_id
    identification
    sex
    direction
    phone
    guardian
    status
    birthday
    father
    mother
    email
  }
}