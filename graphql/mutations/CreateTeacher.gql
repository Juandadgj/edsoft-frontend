mutation CreateTeacher(
  $degree: String!
  $direction: String!
  $email: String!
  $identification: String!
  $last_name: String!
  $name: String!
  $phone: String!
  $type_id: Int!
) {
  createTeacher(
    degree: $degree
    direction: $direction
    email: $email
    identification: $identification
    last_name: $last_name
    name: $name
    phone: $phone
    type_id: $type_id
  ) {
    id_teacher
  }
}
