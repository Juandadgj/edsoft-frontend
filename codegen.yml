overwrite: true
schema: 'https://bwhwbidpg4.us-east-1.awsapprunner.com/graphql'
documents: 'graphql/**/*.(graphql|gql)'
generates:
  generated/graphql.tsx:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-react-apollo'
  ./graphql.schema.json:
    plugins:
      - 'introspection'
